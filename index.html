<style>
:root{--bg:#f6f1e7;--surface:#fffdf8;--ink:#16332a;--muted:#5a6b62;--line:#dcd3c0;--brand:#1f6f54;--brand-ink:#fff;--pop:#f2683c;--pop-ink:#2b1308;--mint:#dcefe5;--hero:#17463a;--hero-ink:#f6f1e7;--hero-muted:#b7d3c6;--dw:400;

:root[data-theme="dark"]{--bg:#0e1b16;--surface:#15271f;--ink:#eaf3ee;--muted:#9db3a8;--line:#254236;--brand:#3fbf8f;--brand-ink:#08150f;--pop:#ff8a5c;--mint:#1b3a2e;--hero:#0f2e24}

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font:20px var(--display);font-weight:var(--dw)}
.brand svg{flex:none}
.ctrl{display:flex;gap:8px;align-items:center}
.pill{font:inherit;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 12px;min-height:40px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:36px 28px 28px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--pop);opacity:.9}
.hero>*{position:relative;z-index:1}
h1{font:clamp(32px,6.5vw,56px)/1.15 var(--display);font-weight:var(--dw);margin:0 0 10px;max-width:15ch}
.hero p{margin:0 0 22px;color:var(--hero-muted);max-width:56ch}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input,.search select{font:inherit;padding:10px 14px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);min-height:48px}
.search input{flex:1 1 240px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.results{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 12px}
.count{margin:0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);padding:8px 16px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.solid{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--pop);color:var(--pop-ink);border-radius:20px;padding:8px 16px;min-height:40px;cursor:pointer}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px;padding:0;margin:0;list-style:none}
.cafe{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;position:relative;transition:transform .15s,box-shadow .15s}
.cafe:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,51,42,.12)}
.cafe.pulse{animation:pulse 1.8s ease}
@keyframes pulse{0%,60%{box-shadow:0 0 0 4px var(--pop)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.cafe{transition:none}.cafe.pulse{animation:none;outline:3px solid var(--pop)}}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.type{font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--mint);color:var(--ink)}
.type.t-study{background:var(--pop);color:var(--pop-ink)}
.stat{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.stat::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.stat.open{color:var(--brand)}.stat.open::before{background:var(--brand)}
.cafe h2{font:22px/1.25 var(--display);font-weight:var(--dw);margin:0}
.heart{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.heart svg{fill:none;stroke:currentColor;stroke-width:2}
.heart[aria-pressed=true]{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.heart[aria-pressed=true] svg{fill:currentColor}
.meta{display:grid;gap:2px;color:var(--muted);font-size:14px;margin:8px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:1px 8px}
.tags li.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--brand);font-weight:700;min-height:36px;display:flex;align-items:center}
details p{margin:6px 0 0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--brand);border-radius:20px;padding:6px 12px;min-height:36px;display:inline-flex;align-items:center}
.links a:hover{background:var(--brand);color:var(--brand-ink)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:18px}
.empty button{margin-top:10px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.ring{fill:none;stroke:var(--line);stroke-dasharray:4 5}
.rtxt{fill:var(--muted);font-size:11px}
.dot{stroke:var(--surface);stroke-width:3;cursor:pointer}
.dot.d-study{fill:var(--pop)}.dot.d-cafe{fill:var(--brand)}
.dot:hover,.dot:focus{stroke:var(--ink)}
.campus{fill:var(--ink)}
.mapinfo{min-height:28px;margin:10px 0 0;font-weight:700}
.mapnote{font-size:13px;color:var(--muted);margin:2px 0 0}
.key{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.note{font-size:14px;color:var(--muted);border-left:5px solid var(--pop);padding:4px 12px;margin:28px 0}
footer{padding:24px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.gal h3{font-size:14px;margin:10px 0 6px}.gal-row{display:flex;gap:8px;overflow-x:auto}.gal-row img{height:140px;width:auto;border-radius:10px;border:1px solid var(--line)}

html[data-design="ink"] .chip,html[data-design="ink"] .pill,html[data-design="ink"] .seg,html[data-design="ink"] .solid,html[data-design="ink"] .heart,html[data-design="ink"] .search input,html[data-design="ink"] .search select{border:2px solid var(--ink);border-radius:6px}

html[data-design="sunset"]{--bg:#fff3ec;--surface:#fff;--ink:#2b1c3a;--muted:#6b5b7a;--line:#ecd9e0;--brand:#c2255c;--brand-ink:#fff;--pop:#ffb347;--pop-ink:#3a1f00;--mint:#ffe3d6;--hero:linear-gradient(135deg,#d6336c,#7048e8);--hero-ink:#fff;--hero-muted:#fff}

html[data-design="sunset"] .links a{border-color:var(--brand)}

const CAMPUS={lat:37.6322,lng:127.0773};
function meters(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const ADDR={lat:37.6260022,lng:127.0775601};
CAFES.forEach(c=>{c.dist=Math.round(meters(CAMPUS,c)/50)*50;c.dAddr=Math.round(meters(ADDR,c)/10)*10;});

const $=id=>document.getElementById(id);
const ZONES=["all","gongneung","hagye","wolgye","junggye","sanggye","nearby"];
const state={zone:"all",q:"",sort:"dist",on:new Set(),study:false,late:false,open:false,saved:false,friendly:false,unmanned:false,addr:false,view:"list",lang:"en"};
let L=I18N.en, lastResults=[];
const t=k=>L[k]||I18N.en[k]||k;
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

// ---- favorites (kept in this browser only) ----
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"));}catch(e){}
function saveFavs(){try{localStorage.setItem("favs",JSON.stringify([...favs]));}catch(e){}}

// ---- open now (Seoul time) ----
const DAYS={daily:[0,1,2,3,4,5,6],monThu:[1,2,3,4],friSat:[5,6],monFri:[1,2,3,4,5],satSun:[6,0],sun:[0],sat:[6],tueSun:[2,3,4,5,6,0],wedSun:[3,4,5,6,0],mon:[1],tue:[2],monTue:[1,2],thuFri:[4,5],thuSun:[4,5,6,0],monSat:[1,2,3,4,5,6]};
const toMin=s=>{const [h,m]=s.split(":");return +h*60+ +m;};
function seoulNow(){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return {d:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),m:(+g("hour")%24)*60+ +g("minute")};
}
function isOpen(c,now){
  if(c.h24)return true;
  if(!c.h.length)return null;
  for(const s of c.h){
    if(s.length!==2||!DAYS[s[0]])continue;
    const [a,b]=s[1].split("-");const st=toMin(a);let en=toMin(b);if(en<=st)en+=1440;
    if(DAYS[s[0]].includes(now.d)&&now.m>=st&&now.m<en)return true;
    if(en>1440&&DAYS[s[0]].includes((now.d+6)%7)&&now.m<en-1440)return true;
  }
  return false;
}

// ---- filters ----
const CHIPS=[["cFriendly",on=>state.friendly=on],["cUnmanned",on=>state.unmanned=on],["openNow",on=>state.open=on],["cStudy",on=>state.study=on],["cLate",on=>state.late=on],["outlets",on=>on?state.on.add("outlets"):state.on.delete("outlets")],["quiet",on=>on?state.on.add("quiet"):state.on.delete("quiet")],["cSaved",on=>state.saved=on]];
const chips=$("chips"), chipEls=[];
CHIPS.forEach(([k,fn])=>{const b=el("button","chip");b.type="button";b.setAttribute("aria-pressed","false");
 b.addEventListener("click",()=>{const p=b.getAttribute("aria-pressed")==="true";b.setAttribute("aria-pressed",String(!p));fn(!p);render();});
 chips.appendChild(b);chipEls.push([k,b]);});
function clearAll(){state.q="";state.zone="all";$("zone").value="all";state.on.clear();state.study=false;state.late=false;state.open=false;state.saved=false;state.friendly=false;state.unmanned=false;state.addr=false;$("q").value="";chipEls.forEach(([,b])=>b.setAttribute("aria-pressed","false"));render();}

function priceText(c){return c.pl?fill(t("price"),{p:t("lvl"+c.pl)}):t("priceNone");}
function koName(c){const m=c.name.match(/\(([^)]+)\)/);return m?m[1]:c.name;}
function gallery(c,key,h){const list=c[key];if(!list||!list.length)return null;const w=el("div","gal");w.appendChild(el("h3","",t(h)));const row=el("div","gal-row");
 list.forEach(src=>{const i=document.createElement("img");i.src=src;i.loading="lazy";i.alt=c.name+" - "+t(h);row.appendChild(i);});w.appendChild(row);return w;}
function distText(d){return d>=1000?(d/1000).toFixed(1)+" km":d+" m";}
function hoursText(c){if(!c.h.length)return t("hoursNone");return c.h.map(s=>s.length===2?t(s[0])+" "+s[1]:t(s[0])).join(", ");}
function isDark(){const r=document.documentElement.dataset.theme;return r==="dark"||(!r&&matchMedia("(prefers-color-scheme: dark)").matches);}
function themeLabel(){$("theme").textContent=isDark()?t("light"):t("dark");}
const HEART='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2 0 3.5 1 5.3 3 1.8-2 3.3-3 5.3-3 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';

function goTo(pid){
  state.view="list";render();
  const card=document.querySelector('[data-pid="'+pid+'"]');
  if(card){card.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});card.classList.remove("pulse");void card.offsetWidth;card.classList.add("pulse");}
}

function drawMap(r){
  const box=$("map");box.innerHTML="";
  if(!r.length)return;
  const NS="http://www.w3.org/2000/svg";
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const pts=r.concat([{lat:CAMPUS.lat,lng:CAMPUS.lng}]);
  const k=Math.cos(CAMPUS.lat*Math.PI/180);
  const xs=pts.map(p=>p.lng*k),ys=pts.map(p=>p.lat);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const W=640,H=420,pad=40,sc=Math.min((W-2*pad)/Math.max(maxX-minX,1e-6),(H-2*pad)/Math.max(maxY-minY,1e-6));
  const ox=(W-(maxX-minX)*sc)/2,oy=(H-(maxY-minY)*sc)/2;
  const X=p=>ox+(p.lng*k-minX)*sc,Y=p=>H-(oy+(p.lat-minY)*sc);
  const svg=mk("svg",{viewBox:"0 0 "+W+" "+H,role:"group","aria-label":t("viewMap")});
  const cx=X(CAMPUS),cy=Y(CAMPUS),pxKm=sc/111.32;
  [1,2,3,4].forEach(km=>{const rr=km*pxKm;if(rr<W*0.75){svg.appendChild(mk("circle",{cx:cx,cy:cy,r:rr,class:"ring"}));const tx=mk("text",{x:cx+rr*0.71+3,y:cy-rr*0.71-3,class:"rtxt"});tx.textContent=km+" km";svg.appendChild(tx);}});
  svg.appendChild(mk("rect",{x:cx-8,y:cy-8,width:16,height:16,rx:3,class:"campus",transform:"rotate(45 "+cx+" "+cy+")"}));
  const ct=mk("text",{x:cx+14,y:cy+4,class:"rtxt","font-weight":"700"});ct.textContent=t("campus");svg.appendChild(ct);
  r.forEach(c=>{
    const d=mk("circle",{cx:X(c),cy:Y(c),r:10,class:"dot d-"+c.type,tabindex:"0",role:"link","aria-label":c.name});
    const show=()=>{$("mapInfo").textContent=c.name+" · "+distText(c.dist);};
    d.addEventListener("mouseenter",show);d.addEventListener("focus",show);
    d.addEventListener("click",()=>goTo(c.pid));
    d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();goTo(c.pid);}});
    svg.appendChild(d);
  });
  box.appendChild(svg);
}

function render(){
  const now=seoulNow();
  CAFES.forEach(c=>{c._open=isOpen(c,now);});
  let r=CAFES.filter(c=>(state.zone==="all"||(c.zone||"gongneung")===state.zone)&&(!state.study||c.type==="study")&&(!state.late||c.late)&&(!state.open||c._open===true)&&(!state.friendly||!c.ns)&&(!state.unmanned||c.un)&&(!state.addr||c.dAddr<=700)&&(!state.saved||favs.has(c.pid))&&[...state.on].every(f=>c.feats.includes(f))&&(c.name+" "+c.area).toLowerCase().includes(state.q.toLowerCase()));
  r.sort((a,b)=>state.sort==="dist"?(state.addr?a.dAddr-b.dAddr:a.dist-b.dist):state.sort==="rating"?(b.rating||-1)-(a.rating||-1):state.sort==="reviews"?b.n-a.n:(!!b.late-!!a.late)||(a.dist-b.dist));
  lastResults=r;
  $("count").textContent=fill(t("count"),{n:r.length})+" · "+fill(t("countOpen"),{o:r.filter(c=>c._open===true).length});
  const map=state.view==="map";
  $("list").hidden=map;$("mapWrap").hidden=!map;
  $("vList").setAttribute("aria-pressed",String(!map));$("vMap").setAttribute("aria-pressed",String(map));
  $("rand").disabled=!r.length;
  const list=$("list");list.innerHTML="";
  if(map){$("mapInfo").textContent="";drawMap(r);}
  if(!r.length){const li=el("li","empty",t("empty")+" ");const b=el("button","chip",t("clear"));b.type="button";b.addEventListener("click",clearAll);li.appendChild(document.createElement("br"));li.appendChild(b);list.appendChild(li);return;}
  r.forEach(c=>{
    const li=el("li","cafe");li.dataset.pid=c.pid;
    const head=el("div","head"),left=el("div");
    const badges=el("div","badges");
    badges.appendChild(el("span","type t-"+c.type,c.type==="study"?t("tStudy"):t("tCafe")));
    if(c._open!==null)badges.appendChild(el("span","stat"+(c._open?" open":""),c._open?t("openNow"):t("closedNow")));
    left.appendChild(badges);left.appendChild(el("h2","",c.name));
    const hb=el("button","heart");hb.type="button";hb.innerHTML=HEART;
    const f=favs.has(c.pid);hb.setAttribute("aria-pressed",String(f));hb.setAttribute("aria-label",(f?t("unsave"):t("save"))+": "+c.name);
    hb.addEventListener("click",()=>{favs.has(c.pid)?favs.delete(c.pid):favs.add(c.pid);saveFavs();render();});
    head.appendChild(left);head.appendChild(hb);li.appendChild(head);
    const m=el("div","meta");
    [fill(t("dist"),{a:c.area,d:distText(c.dist)}),state.addr?fill(t("distAddr"),{d:distText(c.dAddr)}):"",hoursText(c),c.rating==null?t("noRating"):fill(t("rating"),{r:c.rating.toFixed(1),n:c.n})+(c.few?t("few"):""),priceText(c)].filter(Boolean).forEach(x=>m.appendChild(el("span","",x)));
    li.appendChild(m);
    const tags=el("ul","tags");
    if(c.late)tags.appendChild(el("li",state.late?"on":"",c.h24?t("t24"):t("tLate")));
    if(c.un)tags.appendChild(el("li",state.unmanned?"on":"",t("tUnmanned")));
    if(c.ns)tags.appendChild(el("li","",t("tNoStudy")));
    c.feats.forEach(k=>tags.appendChild(el("li",state.on.has(k)?"on":"",t(k))));
    if(tags.children.length)li.appendChild(tags);
    const d=el("details");d.appendChild(el("summary","",t("more")));
    d.appendChild(el("p","",c.facts.map(k=>L.f[k]||I18N.en.f[k]).join(" ")));
    if(c.items)d.appendChild(el("p","",t("reported")+" "+c.items.map(x=>t(x[0])+" "+fill(t("won"),{n:x[1].toLocaleString("en-US")})).join(", ")));
    [gallery(c,"photos","photosH"),gallery(c,"menu","menuH")].forEach(g=>g&&d.appendChild(g));
    const links=el("div","links");
    const add=(label,href)=>{const a=el("a","",label);a.href=href;a.target="_blank";a.rel="noopener";links.appendChild(a);};
    add(t("dirs"),"https://www.google.com/maps/dir/?api=1&destination="+c.lat+","+c.lng+"&destination_place_id="+c.pid);
    add(t("maps"),"https://www.google.com/maps/place/?q=place_id:"+c.pid);
    add(t("nv"),"https://map.naver.com/p/search/"+encodeURIComponent(koName(c)));
    if(c.url)add(t("web"),c.url);
    d.appendChild(links);li.appendChild(d);list.appendChild(li);
  });
}
function setLang(code){
  if(!I18N[code])code="en";state.lang=code;L=I18N[code];
  document.documentElement.lang=code;$("lang").value=code;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  $("q").placeholder=t("ph");$("q").setAttribute("aria-label",t("ph"));
  $("langlabel").textContent=t("lang");$("designlabel").textContent=t("design");$("design").setAttribute("aria-label",t("design"));$("lang").setAttribute("aria-label",t("lang"));
  chipEls.forEach(([k,b])=>b.textContent=t(k));
  const z=$("zone");z.innerHTML="";ZONES.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=t("zone_"+k);z.appendChild(o);});z.value=state.zone;z.setAttribute("aria-label",t("zone_all"));
  themeLabel();render();
  try{localStorage.setItem("lang",code);}catch(e){}
}
$("q").addEventListener("input",e=>{state.q=e.target.value;render();});
$("zone").addEventListener("change",e=>{state.zone=e.target.value;render();});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
$("lang").addEventListener("change",e=>setLang(e.target.value));
$("vList").addEventListener("click",()=>{state.view="list";render();});
$("vMap").addEventListener("click",()=>{state.view="map";render();});
$("rand").addEventListener("click",()=>{
  const good=lastResults.filter(c=>!c.ns),base=good.length?good:lastResults,open=base.filter(c=>c._open===true),pool=open.length?open:base;
  if(pool.length)goTo(pool[Math.floor(Math.random()*pool.length)].pid);
});
$("theme").addEventListener("click",()=>{document.documentElement.dataset.theme=isDark()?"light":"dark";themeLabel();});

let design="ink";
try{design=localStorage.getItem("design")||"ink";}catch(e){}
function setDesign(d){if(!["ink","sunset","forest"].includes(d))d="ink";document.documentElement.dataset.design=d;$("design").value=d;try{localStorage.setItem("design",d);}catch(e){}}
$("design").addEventListener("change",e=>setDesign(e.target.value));
setDesign(design);
let start="";
try{start=localStorage.getItem("lang")||"";}catch(e){}
if(!I18N[start]){const n=(navigator.language||"en").slice(0,2).toLowerCase();start=I18N[n]?n:"en";}
setLang(start);
</script>
